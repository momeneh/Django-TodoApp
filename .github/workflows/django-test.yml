name: Django project test
on:
  push:
    branches: [ "api" ]
  pull_request:
    branches: [ "api" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up docker compose  
      run: docker compose up -d
    - name: Run tests
      run: docker exec django_app sh -c "flake8 ." 
   
