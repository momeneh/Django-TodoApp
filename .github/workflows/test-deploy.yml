name: Django project test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  Test:
    name: Test
    runs-on: ubuntu-latest
    
    env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
    - uses: actions/checkout@v4
    - name: set up docker compose  
      run: docker compose up -d
    - name: Run tests
      run: docker exec backend sh -c "flake8 && pytest ." 
   
  #secrets should be described in github/repo/setting/secrets/action
  # Deploy:
  #   if: ${{ always() && contains(join(needs.*.result,','), 'success') }}
  #   name: Deploy
  #   needs: Test
  #   runs-on: ubuntu-latest
  #   steps: 
  #   - uses: actions/checkout@v4
  #   - name: Connect and Execute commands
  #     uses: appleboy/ssh-action@master
  #     with: 
  #       username: ${{secrets.USERNAME}}
  #       password: ${{secrets.PASSWORD}}
  #       host: ${{secrets.HOST}}
  #       port:  ${{secrets.PORT}}
  #       scrip: |
  #         cd ${{secrets.project_PATH}}
  #         docker compose -f docker-compose-stage.yml stop
  #         git pull
  #         docker-compose -f docker-compose-stage.yml restart

  deploy:
      name: Trigger Render Deploy
      needs: test
      runs-on: ubuntu-latest
      # Only run deployment when pushed to main (ignores pull requests)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      steps:
        - name: Pinging Render Deploy Hook
          env:
            RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          run: |
            echo "Triggering deployment on Render..."
            curl -X POST "$RENDER_URL"
            echo "Deployment triggered successfully!"