version: '3.8'

services:
 
  web:
    build: .
    container_name: django_app
    # command:    gunicorn core.wsgi --bind 0.0.0.0:8000 #&& python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --noinput
    command: >
      sh -c "python manage.py collectstatic --noinput;
             gunicorn core.wsgi --bind 0.0.0.0:8000"
    volumes:
      - ./core:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DB_ENGINE=${DB_ENGINE:-mysql}
      - DB_NAME=${DB_NAME:-django_db}
      - DB_USER=${DB_USER:-django_user}
      - DB_PASSWORD=${DB_PASSWORD:-django_password}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
    restart: always

  nginx:
    image: nginx
    container_name: nginx
    restart : always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/home/app/static
      - media_volume:/home/app/media
    ports:
      - "80:80"
    depends_on:
     - web  

volumes:
  static_volume:
  media_volume:

